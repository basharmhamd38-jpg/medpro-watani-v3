name: Build V1 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup release keystore
        env:
          WATANI_KEYSTORE_BASE64: ${{ secrets.WATANI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$WATANI_KEYSTORE_BASE64" ]; then
            echo "$WATANI_KEYSTORE_BASE64" | base64 --decode > android/app/watani-release.keystore
            echo "keystore restored from secrets"
          else
            echo "no keystore secret — build will fall back to debug signing"
          fi

      - name: Build release APK
        working-directory: android
        timeout-minutes: 60
        env:
          WATANI_STORE_FILE: watani-release.keystore
          WATANI_STORE_PASSWORD: ${{ secrets.WATANI_STORE_PASSWORD }}
          WATANI_KEY_ALIAS: ${{ secrets.WATANI_KEY_ALIAS }}
          WATANI_KEY_PASSWORD: ${{ secrets.WATANI_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --console=plain -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: medpro-watani-v1-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
          if-no-files-found: error
